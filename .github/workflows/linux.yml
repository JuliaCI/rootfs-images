name: Build
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  # The one required check
  images:
    timeout-minutes: 10
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo build: ${{ needs.build.result }}
          echo test: ${{ needs.test.result }}
      - run: exit 1
        if: needs.build.result != 'success' || needs.test.result != 'success'
  # The tooling's own tests; on Windows too, where file modes are ACLs
  test:
    timeout-minutes: 30
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - run: julia --color=yes --project=. -e 'import Pkg; Pkg.instantiate()'
      - run: julia --color=yes --project=. test/runtests.jl
  # Opens a pull request that makes the RootfsImages package list the release's images; once
  # a maintainer merges it and registers the version, the Pkg servers mirror the images. It
  # needs every build, i.e. every asset uploaded: a Pkg server reads a registered version's
  # Artifacts.toml once, and never retries an artifact it failed to download.
  register_images:
    timeout-minutes: 60
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # The images are the rows of the build matrix of the commit the release built (not of
      # main, which may have moved, nor of the tag, which may have, and not whatever the
      # release holds)
      - run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          images=$(git show "$GITHUB_SHA:.github/workflows/linux.yml" | yq '.jobs.build.strategy.matrix.image[].slug')
          julia --color=yes --startup-file=no RootfsImages/add_images.jl "$TAG" $images
      # The version follows the tag (vA.B is A.B.0, images added to it later bump the patch).
      # Rerunnable: nothing new is no pull request, and a rerun updates the open one.
      - run: |
          if git diff --quiet -- RootfsImages; then
            echo "RootfsImages already lists every image of $TAG; nothing to do"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' RootfsImages/Project.toml)
          branch="rootfsimages-$version"
          title="RootfsImages $version: the images of $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add RootfsImages
          git commit -m "$title"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            echo "The pull request of $branch is open already; updated its branch"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Lists the images of [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG) in RootfsImages $version.

          Workflows of pull requests opened by GitHub Actions wait for approval: use \`Approve workflows to run\` on this one to run the required checks. After merging, comment \`@JuliaRegistrator register subdir=RootfsImages\` on the merge commit.

          A version that skips a minor version (a tag that was never catalogued) isn't sequential for General's AutoMerge: a package author approves it with \`[merge approved]\` on the General pull request.
          EOF
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
  # Every image is a row: `linux/<image>.jl` runs on `ubuntu-24.04<build_on>`, and
  # `windows/<image>.jl` (rows with `os: windows`) on `windows-2022`.
  build:
    timeout-minutes: 120
    name: build / ${{ matrix.image.slug }}
    runs-on: ${{ matrix.image.os == 'windows' && 'windows-2022' || format('ubuntu-24.04{0}', matrix.image.build_on) }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        image:
          # Build a bunch of different "agent" rootfs images.
          - {slug: 'agent_linux.aarch64', build_on: '-arm'}
          - {slug: 'agent_linux.armv7l', build_on: ''}
          - {slug: 'agent_linux.ppc64le', build_on: ''}
          - {slug: 'agent_linux.x86_64', build_on: ''}
          - {slug: 'agent_linux.i686', build_on: ''}

          # The `aws_uploader` image is a `debian`-based image that
          # contains just `awscli`, for usage in secured pipelines
          # that need to upload to AWS.
          - {slug: 'aws_uploader.x86_64', build_on: ''}

          # The `debian_minimal` image is a `debian`-based image that
          # contains no packages.
          - {slug: 'debian_minimal.aarch64', build_on: '-arm'}
          - {slug: 'debian_minimal.armv7l', build_on: ''}
          - {slug: 'debian_minimal.ppc64le', build_on: ''}
          - {slug: 'debian_minimal.x86_64', build_on: ''}
          - {slug: 'debian_minimal.i686', build_on: ''}

          # The `julia_publish` image carries the full signing/packaging
          # toolchain (AWS CLI, p7zip, libdmg-hfsplus, wine, jsign, ...) used
          # by the `julia-publish` pipeline's `publish_all` step. x86_64 only,
          # since that step only runs on linux/x86_64.
          - {slug: 'julia_publish.x86_64', build_on: ''}

          # The `latex` image is used to build the PDF docs
          - {slug: 'latex.x86_64', build_on: ''}

          # The `llvm_passes` image contains `gfortran`, so we use it for our
          # "from source" (`USE_BINARYBUILDER=0`) jobs.
          - {slug: 'llvm_passes.aarch64', build_on: '-arm'}
          - {slug: 'llvm_passes.armv7l', build_on: ''}
          - {slug: 'llvm_passes.i686', build_on: ''}
          - {slug: 'llvm_passes.powerpc64le', build_on: ''}
          - {slug: 'llvm_passes.x86_64', build_on: ''}

          # The `npm_linux` image is a helper for ecosystem jobs that need to build NPM packages
          - {slug: 'npm_linux.x86_64', build_on: ''}

          # The `package_linux` images are all `debian`-based.
          - {slug: 'package_linux.aarch64', build_on: '-arm'}
          - {slug: 'package_linux.armv7l', build_on: ''}
          - {slug: 'package_linux.i686', build_on: ''}
          - {slug: 'package_linux.powerpc64le', build_on: ''}
          - {slug: 'package_linux.x86_64', build_on: ''}
          - {slug: 'package_linux_riscv64.x86_64', build_on: ''}

          # Essentially `package_linux` plus a Rust toolchain and `libclang`
          # for use by the MMTK GC build (`WITH_THIRD_PARTY_GC=mmtk`)
          - {slug: 'package_linux_mmtk.x86_64', build_on: ''}
          - {slug: 'package_linux_mmtk.aarch64', build_on: '-arm'}

          # The `package_musl` image is `alpine`-based.
          - {slug: 'package_musl.x86_64', build_on: ''}

          # The `pkgserver_logsync` image is a helper for https://github.com/JuliaPackaging/PkgServerLogAnalysis.jl
          - {slug: 'pkgserver_logsync.x86_64', build_on: ''}

          # The `rr` image is `debian`-based.
          # It is used for building rr from source and running the rr test suite.
          - {slug: 'rr.aarch64', build_on: '-arm'}
          - {slug: 'rr.x86_64', build_on: ''}

          # The `tester_linux` images are all `debian`-based.
          # They do not include the compiler toolchain.
          - {slug: 'tester_linux.aarch64', build_on: '-arm'}
          - {slug: 'tester_linux.armv7l', build_on: ''}
          - {slug: 'tester_linux.i686', build_on: ''}
          - {slug: 'tester_linux.powerpc64le', build_on: ''}
          - {slug: 'tester_linux.x86_64', build_on: ''}

          # The `tester_musl` image is `alpine`-based.
          # It does not include the compiler toolchain.
          - {slug: 'tester_musl.x86_64', build_on: ''}

          # The `xvfb` image is used in the CI for the PkgEval.jl repo
          - {slug: 'xvfb.aarch64', build_on: '-arm'}
          - {slug: 'xvfb.x86_64', build_on: ''}

          # The `yggdrasil` image is used in the CI for the Yggdrasil repo
          - {slug: 'yggdrasil.x86_64', build_on: ''}

          # The `package_windows` image is MSYS2 plus GCCToolchain_jll, the toolchain of Julia's
          # Windows builds. x86_64 only: 32-bit Windows is being phased out, and the release
          # branches that still build it use package_windows.i686 of v8.5.
          - {slug: 'package_windows.x86_64', os: 'windows'}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: uname -a
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - run: sudo apt-get update
        if: runner.os == 'Linux'
      - run: sudo apt-get -y install binfmt-support debootstrap qemu-user-static
        if: runner.os == 'Linux'
      - run: update-binfmts --display
        if: runner.os == 'Linux'
      - run: julia --color=yes --project=. -e 'import Pkg; @time Pkg.instantiate()'
      - run: julia --color=yes --project=. -e 'import Pkg; @time Pkg.precompile()'
      - run: julia --color=yes --project=. -e '@time import RootfsUtils'
      - run: |
          IMAGE_NAME=$(echo ${{ matrix.image.slug }} | cut -d. -f1)
          IMAGE_ARCH=$(echo ${{ matrix.image.slug }} | cut -d. -f2)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_ARCH=$IMAGE_ARCH" >> $GITHUB_ENV
      - run: julia --color=yes --project=. ${{ matrix.image.os || 'linux' }}/${{ env.IMAGE_NAME }}.jl --arch=${{ env.IMAGE_ARCH }}
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "The tarball name is ${{ steps.build.outputs.tarball_name }}"
      - run: echo "The tarball path is ${{ steps.build.outputs.tarball_path }}"
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.tarball_name != '' && steps.build.outputs.tarball_path != ''
        with:
          name: ${{ steps.build.outputs.tarball_name }}
          path: ${{ steps.build.outputs.tarball_path }}
          if-no-files-found: error
